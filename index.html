<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Libros — BookForge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ffffff;
            color: #333333;
            font-family: Georgia, 'Times New Roman', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }
        header {
            text-align: center;
            margin-bottom: 50px;
            padding-bottom: 30px;
            border-bottom: 3px double #722f37;
            width: 100%;
            max-width: 700px;
        }
        header h1 {
            font-size: 2.6rem;
            color: #722f37;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        header p {
            font-size: 1rem;
            opacity: 0.6;
            font-style: italic;
        }
        ul {
            list-style: none;
            width: 100%;
            max-width: 700px;
        }
        li {
            margin-bottom: 16px;
        }
        li a {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 20px 28px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            text-decoration: none;
            color: #333333;
            transition: background 0.2s, border-color 0.2s;
        }
        li a:hover {
            background: #fafafa;
            border-color: #722f37;
        }
        .slot {
            font-size: 0.85rem;
            color: #722f37;
            white-space: nowrap;
            min-width: 72px;
            font-family: 'Segoe UI', sans-serif;
        }
        .book-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .book-title {
            font-size: 1.15rem;
            font-weight: bold;
        }
        .author {
            font-size: 0.9rem;
            font-style: italic;
            opacity: 0.7;
        }
        footer {
            margin-top: 60px;
            font-size: 0.8rem;
            opacity: 0.4;
            font-family: 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body>
    <header>
        <h1>📚 Mis Libros</h1>
        <p>Leyendo con BookForge · Tema Light</p>
    </header>
    <ul>
        <li>
            <a href="libro1.html">
                <span class="slot">📖 libro1</span>
                <span class="book-info">
                    <span class="book-title">House of Leaves</span>
                    <span class="author">— Mark Z. Danielewski</span>
                </span>
            </a>
        </li>
        <li>
            <a href="libro2.html">
                <span class="slot">📖 libro2</span>
                <span class="book-info">
                    <span class="book-title">Las Mil & Una Noches</span>
                    <span class="author">— Anónimo</span>
                </span>
            </a>
        </li>
    </ul>
    <footer>Publicado con BookForge</footer>
</body>
</html>
